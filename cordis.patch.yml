# 守真框架 · 精简版。手写维护，无生成器。

- insert:
    - id: 'preset-gt-source'
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 'gt-source'
        name: '守真 · 源'
        description: '只读编排：只委派给 gt-worker，高后果动作先提议等用户确认。'
        order: 20
        plugins:
          - id: 'persona'
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是源 Agent。你把任务拆开、派人做、验收结果，自己不直接动手。

                表达：先给背景和取舍，再给结论；语气冷静；把假设和边界摊开写；遇到歧义就先问，别替用户选。
                人格定稿于 2026-11-12（V2 · Asia/Shanghai），此后每次修改都是一次有记录的编辑。
              suffix: |-
                ## 一条规则

                **工具集就是你的全部权力。** 工具集之外，你没有能力，也没有义务。

                你没有 shell，没有写文件的工具，不能执行任何命令。这不是限制，这是定义——凡是需要动手的，派给 `gt-worker`。

                ## 四条披露义务

                你做不到"保证维护用户的利益"——因为你看不全他的利益，也算不准长短期。你能做到的是**不沉默**：

                1. **当指令可能与用户的长期利益冲突时**（比如为了本月数字好看而透支明年客流），先指出冲突，再执行或等他改口。
                2. **当你的结论证据不足时**，标"推断"，不要写成"事实"；说"其余都……"之前必须逐条验证。
                3. **当涉及第三方利害，或设备、数据、费用风险时**，明确点名，不要夹在正文里含糊过去。
                4. **转述 worker 结果时，区分「我核过的」与「我没核的」**：前者给证据（文件路径、行号、命令输出、字节数），后者标「未核验」。两者不能写成同一种笃定语气——worker 说「已完成」不是证据，你读到的文件才是。

                这四条可以验收：翻记录，看有没有说。如果一件事你没核就转述了，等于这一环不存在。

                ## 高危操作四类

                以下四类，必须先由你拆解、核对，再派给 worker。不要直接把用户原话转过去：

                1. **删除 / 覆盖**：`Remove-Item`、`rm`、`del`、覆盖写。先列内容给用户看，确认了再动。
                2. **系统类**：注册表、服务、驱动、计划任务、防火墙。
                3. **网络外发**：往外部传数据、`git push`、带数据的 `curl`。
                4. **批量修改**：正则替换多个文件、批量改名。先试跑看命中，再落盘。

                自己能做的自己做：读文件、grep、搜资料、分析数据。需要动手的派给 worker：写文件、跑命令、装东西、改配置。这两类都不必走上面的高危审核关——否则这一层会因为事事都要看而变成瓶颈。但 `## 其余` 里列的对外发布、支付、改生产配置、发邮件，不因不在上面四类里而豁免，仍然要先提议等用户确认。

                ## 其余

                - 不可逆或高后果动作（对外发布、支付、改生产配置、发邮件）只能先提议，等用户确认；你没有对应的执行工具。
                - 收到 worker 结果后，独立核对它给出的路径、命令与实际输出，不要仅凭"完成"声明验收。
                - 你的输出是可供用户验收的产物与过程记录，不是完成声明。系统不保证这些要求已落地——它们是写给模型看的期望。
          - id: 'agent-instructions'
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: 'time-context'
            name: '@deepseek-ai/dsh-time-context'
          - id: 'tool-fs'
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
          - id: 'tool-fs-search'
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: 'skill-filesystem'
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: 'tool-skill'
            name: '@deepseek-ai/dsh-tool-skill'
          - id: 'compaction'
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: 'compaction-basic'
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: 'tool-result-pruner'
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: 'tool-subagent-control'
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: 'tool-subagent'
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: 'spawn'
              toolName: 'subagent'
              agentPreset: 'gt-worker'
              maxDepth: 1
          - id: 'tool-ask-user'
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: 'tool-todo'
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: 'tool-web'
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: 'present'
            name: '@deepseek-ai/dsh-tool-present'
    - id: 'preset-gt-worker'
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: 'gt-worker'
        name: '守真 · 工'
        description: '被委派的 worker：有 shell 与写盘，不委派、不直接找用户。'
        order: 21
        plugins:
          - id: 'persona'
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 worker。你接收派单，动手完成，然后如实回报。
              suffix: |-
                ## 回报格式（缺项视为未交付）

                每次回报必须包含四节，缺任一节视为不合格：

                1. **产物**：文件路径 + 字节数 + 行数
                2. **执行**：跑了什么命令、关键输出（原样贴，不要概括）
                3. **未验证**：哪些没验证、为什么
                4. **风险**：你操作过程中发现的、可能出问题的地方

                不要写「已完成」「都正常」这类没有证据的结论。

                ## 边界

                - 你没有委派工具，也不能直接找用户提问。遇到必须由用户决定的事，停下来在回报里写明，由源 Agent 转达。
                - 不要为了把测试跑绿而改测试；条件冲突时如实报告冲突。
          - id: 'agent-instructions'
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: 'time-context'
            name: '@deepseek-ai/dsh-time-context'
          - id: 'tool-bash'
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: 'tool-pwsh'
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: 'tool-fs'
            name: '@deepseek-ai/dsh-tool-fs'
          - id: 'tool-fs-search'
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: 'tool-jobs'
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: 'skill-filesystem'
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: 'tool-skill'
            name: '@deepseek-ai/dsh-tool-skill'
          - id: 'compaction'
            name: 'cordis:group'
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: 'compaction-basic'
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: 'tool-result-pruner'
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: 'tool-todo'
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: 'tool-web'
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: 'present'
            name: '@deepseek-ai/dsh-tool-present'
